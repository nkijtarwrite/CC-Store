<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CC Store | 甜點小舖</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 導覽列 -->
    <header>
        <a href="#" class="logo">CC Store 🍰</a>
        <nav>
            <a href="#home">首頁</a>
            <a href="#products">精選甜點</a>
            <a href="#about">關於我們</a>
            <a href="#cart">🛒 購物車 (0)</a>
        </nav>
    </header>

    <!-- 首頁橫幅 -->
    <section id="home" class="hero">
        <h1>享受每個甜蜜時刻</h1>
        <p>純手工製作，天然嚴選食材，為您呈現最美好的滋味</p>
        <a href="#products" class="btn">立即選購</a>
    </section>

    <!-- 商品列表 -->
    <section id="products" class="products">
        <h2>熱銷甜點</h2>
        <div class="grid">
            
            <!-- 商品 1 -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=500&q=80" alt="法式經典草莓蛋糕">
                <div class="card-content">
                    <h3>法式草莓蛋糕</h3>
                    <p class="price">NT$ 850</p>
                    <button class="add-to-cart">加入購物車</button>
                </div>
            </div>

            <!-- 商品 2 -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1563729784474-d77dbb9382f9?auto=format&fit=crop&w=500&q=80" alt="馬卡龍禮盒">
                <div class="card-content">
                    <h3>夢幻馬卡龍禮盒 (6入)</h3>
                    <p class="price">NT$ 520</p>
                    <button class="add-to-cart">加入購物車</button>
                </div>
            </div>

            <!-- 商品 3 -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1606890737304-57a1ca8a5b62?auto=format&fit=crop&w=500&q=80" alt="熔岩巧克力蛋糕">
                <div class="card-content">
                    <h3>熔岩巧克力蛋糕</h3>
                    <p class="price">NT$ 180</p>
                    <button class="add-to-cart">加入購物車</button>
                </div>
            </div>

            <!-- 商品 4 -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1550617931-e17a7b70dce2?auto=format&fit=crop&w=500&q=80" alt="檸檬塔">
                <div class="card-content">
                    <h3>法式酸甜檸檬塔</h3>
                    <p class="price">NT$ 150</p>
                    <button class="add-to-cart">加入購物車</button>
                </div>
            </div>

        </div>
    </section>

    <!-- 頁尾 -->
    <footer>
        <p>&copy; 甜點 All rights reserved.</p>
    </footer>

</body>
</html>
